<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FormWheel — Wheel Battle</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--line:#e5e7eb;--text:#18181b;--muted:#71717a;--accent:#4f46e5;--soft:#eef0ff;--a:#ff6b6b;--b:#22b8cf;--c:#ffb020;--d:#7c5cfc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
button,input{font:inherit}.nav{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{border:0;background:none;font-weight:800;font-size:17px;cursor:pointer}.brand span{background:var(--accent);color:white;border-radius:8px;padding:7px;margin-right:7px}
.tag{font-size:11px;color:var(--accent);background:var(--soft);padding:4px 8px;border-radius:999px;margin-left:6px}.wrap{width:min(720px,calc(100% - 30px));margin:30px auto 60px}
.title{font-size:28px;margin:0 0 7px}.sub{color:var(--muted);margin:0 0 22px;line-height:1.55}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.home{display:grid;grid-template-columns:1fr 1fr;gap:12px}.home button,.btn{border:0;border-radius:12px;padding:17px;font-weight:800;cursor:pointer}
.home button{background:#fff;border:1.5px solid var(--line);text-align:left}.home button:hover{border-color:var(--accent);background:var(--soft)}
label{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:7px}
input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;outline:0;margin-bottom:14px}input:focus{border-color:var(--accent)}
.btn{width:100%;background:var(--accent);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.err{color:#e11d48;font-size:13px;margin-top:9px}
.pin{text-align:center;background:var(--soft);border:1.5px dashed var(--accent);border-radius:14px;padding:20px;margin-bottom:16px}
.pin strong{display:block;font-size:42px;letter-spacing:7px;color:var(--accent)}.small{font-size:13px;color:var(--muted);line-height:1.5}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{padding:16px;border:1.5px solid var(--line);border-radius:13px;text-align:center}.player.me{border-color:var(--accent)}
.score{font-size:32px;font-weight:900;margin-top:5px}.status{text-align:center;color:var(--muted);padding:10px}
.wheel-area{position:relative;width:min(390px,90vw);aspect-ratio:1;margin:5px auto 20px}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid #fff;box-shadow:0 8px 30px #0001;position:relative;overflow:hidden;transition:transform 4s cubic-bezier(.15,.75,.15,1);background:conic-gradient(var(--a) 0 45deg,var(--b) 45deg 90deg,var(--c) 90deg 135deg,var(--d) 135deg 180deg,var(--a) 180deg 225deg,var(--b) 225deg 270deg,var(--c) 270deg 315deg,var(--d) 315deg 360deg)}
.wheel:after{content:'⚔️';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 2px 10px #0002}
.label{position:absolute;left:50%;top:50%;width:90px;margin-left:-45px;margin-top:-9px;text-align:center;color:#fff;font-weight:900;font-size:12px;text-shadow:0 1px 3px #000}
.l1{transform:rotate(22deg) translateY(-125px)}.l2{transform:rotate(67deg) translateY(-125px)}.l3{transform:rotate(112deg) translateY(-125px)}.l4{transform:rotate(157deg) translateY(-125px)}
.pointer{position:absolute;z-index:2;top:-10px;left:50%;transform:translateX(-50%);font-size:34px}
.result{text-align:center;font-size:20px;font-weight:900;padding:16px;background:var(--soft);border-radius:13px;margin-bottom:15px}
.q{font-size:20px;font-weight:900;line-height:1.45;margin-bottom:16px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{border:0;color:#fff;padding:18px;border-radius:12px;font-weight:800;cursor:pointer;min-height:72px}.a{background:var(--a)}.b{background:var(--b)}.c{background:var(--c)}.d{background:var(--d)}
@media(max-width:520px){.home,.players,.answers{grid-template-columns:1fr}.title{font-size:24px}.wheel-area{width:min(330px,90vw)}}
</style>
</head>
<body>
<div class="nav"><button class="brand" onclick="location.href='https://semicolonxss.github.io/Formwheel/'"><span>F</span>FormWheel <i class="tag">Wheel Battle</i></button><b id="navpin"></b></div>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:'AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE',
 authDomain:'formwheel.firebaseapp.com',
 databaseURL:'https://formwheel-default-rtdb.firebaseio.com/',
 projectId:'formwheel',storageBucket:'formwheel.firebasestorage.app',
 messagingSenderId:'431583088241',appId:'1:431583088241:web:74e0e34ea1e3e1170c55d0'
};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const qs=[
 {q:'대한민국의 수도는?',a:['부산','서울','인천','대구'],c:1},
 {q:'물의 화학식은?',a:['CO₂','O₂','H₂O','NaCl'],c:2},
 {q:'태양계에서 가장 큰 행성은?',a:['지구','목성','화성','토성'],c:1},
 {q:'1년은 평년 기준 며칠?',a:['364일','365일','366일','360일'],c:1},
 {q:'HTML은 무엇의 약자일까요?',a:['Hyper Text Markup Language','High Text Machine Language','Home Tool Markup Language','Hyperlink Text Main Language'],c:0},
 {q:'5×6은?',a:['25','30','35','40'],c:1}
];
// 룰렛은 8칸이지만 실제 종류는 4가지(+10, 퀴즈, +20, 스틸)가 반복됩니다.
const outcomeLabels=['+10 점','🧠 퀴즈','+20 점','💥 스틸'];
const STEAL_AMT=15;
let pin='',id='',name='',host=false,rot=0,unsub=[];
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const ref=()=>db.ref('wheelBattle/'+pin);
function clean(){unsub.forEach(x=>x());unsub=[]}
function view(x){clean();app.innerHTML=x}
function home(){
 view(`<main class="wrap"><h1 class="title">🎡 Wheel Battle</h1><p class="sub">룰렛을 돌려서 공격하고, 점수를 뺏고, 마지막까지 살아남으세요!</p>
 <div class="home"><button onclick="create()"><b>⚔️ Battle 만들기</b><br><span class="small">방을 만들고 친구를 초대해요.</span></button>
 <button onclick="join()"><b>🚪 참가하기</b><br><span class="small">친구의 4자리 코드로 들어가요.</span></button></div></main>`);
}
function create(){
 view(`<main class="wrap"><div class="card"><h1 class="title">Battle 만들기</h1><label>닉네임</label><input id="name" maxlength="12" placeholder="닉네임을 입력하세요"><button class="btn" onclick="makeRoom()">방 만들기</button><div id="err" class="err"></div></div></main>`);
}
function makeRoom(){
 name=document.getElementById('name').value.trim();if(!name)return err('닉네임을 입력해주세요.');
 pin=String(Math.floor(1000+Math.random()*9000));id=Math.random().toString(36).slice(2);host=true;
 ref().set({status:'lobby',turn:id,round:0,players:{[id]:{name,score:0,joined:true}},createdAt:Date.now()}).then(lobby)
}
function join(){
 view(`<main class="wrap"><div class="card"><h1 class="title">참가하기</h1><label>닉네임</label><input id="name" maxlength="12" placeholder="닉네임을 입력하세요">
 <label>Battle 코드</label><input id="pin" inputmode="numeric" maxlength="4" placeholder="1234"><button class="btn" onclick="enter()">참가하기</button><div id="err" class="err"></div></div></main>`);
}
function enter(){
 name=document.getElementById('name').value.trim();pin=document.getElementById('pin').value.trim();
 if(!name||pin.length!==4)return err('닉네임과 4자리 코드를 확인해주세요.');
 id=Math.random().toString(36).slice(2);host=false;
 ref().once('value').then(s=>{if(!s.exists())throw Error('없는 방');return ref().child('players/'+id).set({name,score:0,joined:true})}).then(lobby).catch(()=>err('존재하지 않는 Battle입니다.'));
}
function err(x){const e=document.getElementById('err');if(e)e.textContent=x}
function lobby(){
 view(`<main class="wrap"><div class="pin"><div>Battle 코드</div><strong>${pin}</strong><div class="small">친구에게 이 코드를 알려주세요.</div></div>
 <div class="card"><h2>플레이어</h2><div id="players" class="players"></div><div id="status" class="status">상대를 기다리는 중…</div>${host?'<button class="btn" id="start" disabled>게임 시작</button>':''}</div></main>`);
 document.getElementById('navpin').textContent=pin;
 const p=ref().child('players');
 const cb=s=>{const v=s.val()||{},arr=Object.entries(v);
 document.getElementById('players').innerHTML=arr.map(([k,x])=>`<div class="player ${k===id?'me':''}">🎮<div><b>${esc(x.name)}</b></div><div class="score">${x.score||0}</div></div>`).join('');
 document.getElementById('status').textContent=arr.length<2?'상대를 기다리는 중…':'준비 완료!';
 if(host&&arr.length>=2)document.getElementById('start').disabled=false};
 p.on('value',cb);unsub.push(()=>p.off('value',cb));if(host)document.getElementById('start').onclick=start;
}
function start(){ref().update({status:'spin',round:1,turn:id,result:null})}
function watch(){
 const cb=s=>{const g=s.val();if(!g)return;
 if(g.status==='spin')spinScreen(g);else if(g.status==='question')questionScreen(g);
 else if(g.status==='result')resultScreen(g);else if(g.status==='final')finalScreen(g)};
 ref().on('value',cb);unsub.push(()=>ref().off('value',cb));
}
function spinScreen(g){
 const myTurn=g.turn===id;
 view(`<main class="wrap"><div class="card"><div class="players" id="score"></div><div class="status">Round ${g.round||1} · ${myTurn?'🎯 당신의 차례':'⏳ 상대의 차례'}</div>
 <div class="wheel-area"><div class="pointer">▼</div><div class="wheel" id="wheel"><span class="label l1">+10</span><span class="label l2">퀴즈</span><span class="label l3">+20</span><span class="label l4">스틸</span></div></div>
 <button class="btn" ${myTurn?'':'disabled'} onclick="spin()">🎡 룰렛 돌리기</button><p class="small" style="text-align:center">룰렛 결과에 따라 점수를 얻거나 상대 점수를 뺏을 수 있어요.</p></div></main>`);
 drawScores(g);watch();
}
function drawScores(g){
 const p=g.players||{},arr=Object.entries(p),el=document.getElementById('score');
 if(el)el.innerHTML=arr.map(([k,x])=>`<div class="player ${k===id?'me':''}">🎮 ${esc(x.name)}<div class="score">${x.score||0}</div></div>`).join('');
}
function spin(){
 const n=Math.floor(Math.random()*8);rot+=1440+(360/8)*(n+.5);
 const w=document.getElementById('wheel');if(w)w.style.transform=`rotate(${rot}deg)`;
 setTimeout(()=>resolveSpin(n),4100);
}
// 스핀 결과를 실제로 게임 상태에 반영합니다. (이전 버전은 +10/+20 칸에서 아무 처리도 하지 않아 화면이 멈췄습니다)
function resolveSpin(n){
 const type=n%4; // 0:+10  1:퀴즈  2:+20  3:스틸
 if(type===1){
  ref().update({status:'question',spinIndex:n,question:Math.floor(Math.random()*qs.length),turn:id});
  return;
 }
 ref().once('value').then(s=>{
  const g=s.val()||{},p=g.players||{};
  if(!p[id])return;
  if(type===0||type===2){
   const amt=type===0?10:20;
   p[id]={...p[id],score:(p[id].score||0)+amt};
   ref().update({players:p,status:'result',spinIndex:n,result:amt,stole:false,turn:other(p),round:g.round||1});
  }else{
   const opp=other(p);
   const amt=Math.min(STEAL_AMT,p[opp]?.score||0);
   p[opp]={...p[opp],score:(p[opp].score||0)-amt};
   p[id]={...p[id],score:(p[id].score||0)+amt};
   ref().update({players:p,status:'result',spinIndex:n,result:amt,stole:true,turn:other(p),round:g.round||1});
  }
 });
}
function questionScreen(g){
 const q=qs[g.question%qs.length],myTurn=g.turn===id;
 view(`<main class="wrap"><div class="card"><div class="status">${myTurn?'🎯 당신이 룰렛을 돌렸어요!':'⏳ 상대가 룰렛을 돌렸어요!'}</div>
 <div class="result">🧠 퀴즈</div>
 <div class="q">${esc(q.q)}</div><div class="answers">${q.a.map((a,i)=>`<button class="ans ${['a','b','c','d'][i]}" onclick="answer(${i})" ${myTurn?'':'disabled'}>${esc(a)}</button>`).join('')}</div>
 </div></main>`);
 drawScores(g);watch();
}
function answer(i){
 ref().once('value').then(s=>{const g=s.val(),q=qs[g.question%qs.length],p=g.players||{};
 let delta=i===q.c?10:0;p[id].score=(p[id].score||0)+delta;
 ref().update({players:p,status:'result',result:delta,stole:false,answer:i,correct:q.c,turn:other(p),round:g.round||1});
 });
}
function other(p){const ids=Object.keys(p);return ids.find(x=>x!==id)||id}
function resultScreen(g){
 const delta=g.result||0;
 const msg=g.stole
  ?(delta?`💥 상대에게서 ${delta}점을 뺏었어요!`:'상대에게 뺏을 점수가 없었어요.')
  :(delta?`🎉 +${delta}점!`:'😢 아쉽다! 0점');
 view(`<main class="wrap"><div class="card"><div class="result">${msg}</div>
 <p class="status">다음 차례는 <b>${esc((g.players||{})[g.turn]?.name||'상대')}</b></p><button class="btn" onclick="nextRound()">다음 룰렛</button></div></main>`);
 drawScores(g);watch();
}
function nextRound(){
 ref().once('value').then(s=>{const g=s.val();if((g.round||1)>=10)return ref().update({status:'final'});
 ref().update({status:'spin',round:(g.round||1)+1})});
}
function finalScreen(g){
 const arr=Object.values(g.players||{}).sort((a,b)=>(b.score||0)-(a.score||0));
 view(`<main class="wrap"><div class="card" style="text-align:center"><div style="font-size:55px">🏆</div><h1>Battle 종료!</h1>
 <h2>우승: ${esc(arr[0]?.name||'')}</h2>${arr.map((x,i)=>`<p>${i+1}위　<b>${esc(x.name)}</b>　${x.score||0}점</p>`).join('')}
 <button class="btn" onclick="location.reload()">다시 하기</button></div></main>`);
}
home();
</script>
</body>
</html>
