<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FormWheel — Wheel Battle</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#18181b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.nav{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{border:0;background:none;font-weight:800;font-size:18px;cursor:pointer}.tag{font-size:11px;color:#4f46e5;background:#eef0ff;padding:4px 8px;border-radius:99px;margin-left:6px}.code{font-size:13px;color:#71717a}.code b{color:#18181b;letter-spacing:2px}main{min-height:calc(100vh - 62px);display:flex;justify-content:center;padding:30px 16px}.stage{width:100%;max-width:720px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 5px 25px #00000008}.title{text-align:center;font-size:28px;margin:4px 0 8px;font-weight:850}.sub{text-align:center;color:#71717a;line-height:1.55;margin:0 0 24px}.row,.players,.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#52525b}input{width:100%;padding:13px;border:1.5px solid #dddde5;border-radius:11px;outline:0}input:focus{border-color:#4f46e5}.btn{width:100%;padding:14px;border:0;border-radius:11px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.ghost{background:#fff;color:#18181b;border:1.5px solid #dddde5}.pin{text-align:center;background:#eef0ff;border:1.5px dashed #4f46e5;border-radius:15px;padding:20px;margin-bottom:18px}.pin small{display:block;color:#4f46e5;font-weight:700}.pin strong{font-size:45px;letter-spacing:7px}.player{border:1.5px solid #e5e7eb;border-radius:14px;padding:17px;text-align:center}.me{border-color:#4f46e5;background:#f7f7ff}.emoji{font-size:28px}.pname{font-weight:800}.score{font-size:30px;font-weight:850;margin-top:5px}.status{text-align:center;background:#f1f1f8;color:#71717a;border-radius:11px;padding:12px;margin:14px 0;font-size:14px}.round{display:flex;justify-content:space-between;color:#71717a;font-size:13px;font-weight:700;margin-bottom:10px}.wheel{position:relative;width:min(360px,82vw);height:min(360px,82vw);margin:15px auto 20px;transition:transform 1.8s cubic-bezier(.15,.8,.2,1)}.wheel svg{width:100%;height:100%;filter:drop-shadow(0 8px 18px #0002)}.pointer{position:absolute;left:50%;top:-7px;transform:translateX(-50%);font-size:30px;z-index:2}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#fff;border:7px solid #4f46e5;display:flex;align-items:center;justify-content:center;z-index:2}.question{font-size:22px;font-weight:850;line-height:1.4;margin:10px 0 18px}.answer{border:0;border-radius:12px;padding:18px 10px;color:#fff;font-weight:800;cursor:pointer}.a{background:#ff6b6b}.b{background:#22b8cf}.c{background:#ffb020}.d{background:#7c5cfc}.answer:disabled{opacity:.4}.result{text-align:center}.big{font-size:60px}.leader{display:flex;justify-content:space-between;background:#f1f1f8;border-radius:10px;padding:12px;margin:8px 0}.err{color:#e11d48;text-align:center;font-size:13px;min-height:18px;margin-top:8px}@media(max-width:520px){.card{padding:18px}.row,.players,.answers{gap:9px}.title{font-size:23px}.question{font-size:19px}.pin strong{font-size:38px}}
</style></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script>
(()=>{const HOME='https://semicolonxss.github.io/Formwheel/';const C={apiKey:'AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE',authDomain:'formwheel.firebaseapp.com',databaseURL:'https://formwheel-default-rtdb.firebaseio.com/',projectId:'formwheel',storageBucket:'formwheel.firebasestorage.app',messagingSenderId:'431583088241',appId:'1:431583088241:web:74e0e34ea1e3e1170c55d0'};firebase.initializeApp(C);const db=firebase.database();
const Q=[{text:'대한민국의 수도는?',choices:['부산','서울','인천','대구'],correct:1},{text:'물의 화학식은?',choices:['CO₂','O₂','H₂O','NaCl'],correct:2},{text:'태양계에서 가장 큰 행성은?',choices:['지구','목성','화성','토성'],correct:1},{text:'평년은 며칠일까요?',choices:['364일','365일','366일','360일'],correct:1},{text:'HTML의 뜻으로 맞는 것은?',choices:['HyperText Markup Language','HighText Machine Language','Home Tool Markup Language','Hyperlink Text Main Language'],correct:0}];
const E=['+10','+20','QUIZ','QUIZ','+10','BONUS','+20','STEAL'];let screen='home',pin='',uid='',name='',role='',round=0,questions=Q,time=10,score=0,oppScore=0,spinKey='',appliedKey='';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ref=()=>db.ref('wheelBattle/'+pin),players=()=>ref().child('players'),state=()=>ref().child('state');let offs=[];function off(){offs.forEach(f=>f());offs=[]}function nav(){return `<div class="nav"><button class="brand" id="home">FormWheel <span class="tag">Wheel Battle</span></button>${pin?`<div class="code">코드 <b>${pin}</b></div>`:''}</div>`}function go(s){off();screen=s;render()}function render(){if(screen==='home')home();else if(screen==='create')create();else if(screen==='join')join();else if(screen==='lobby')lobby();else if(screen==='wheel')wheel();else if(screen==='quiz')quiz();else if(screen==='event')event();else finalScreen();const h=document.getElementById('home');if(h)h.onclick=()=>{off();pin='';screen='home';render()}}
function bindStateNav(){const sc=s=>{const v=s.val();if(!v)return;
  if(v.phase==='wheel'&&screen!=='wheel'){round=v.round;go('wheel')}
  else if(v.phase==='quiz'&&screen!=='quiz'){round=v.round;go('quiz')}
  else if(v.phase==='event'&&screen!=='event'){round=v.round;go('event')}
  else if(v.phase==='final'&&screen!=='final')go('final')};
  state().on('value',sc);offs.push(()=>state().off('value',sc))}
function home(){app.innerHTML=nav()+`<main><div class="stage"><div class="card"><h1 class="title">🎡 Wheel Battle</h1><p class="sub">친구와 실시간으로 룰렛을 돌리고 Quiz를 풀며 대결해보세요!</p><div class="row"><button class="btn" id="make">⚔️ Battle 만들기</button><button class="btn ghost" id="joinBtn">🚪 참가하기</button></div></div></div></main>`;make.onclick=()=>go('create');joinBtn.onclick=()=>go('join')}
function create(){app.innerHTML=nav()+`<main><div class="stage"><div class="card"><h1 class="title">Battle 만들기</h1><p class="sub">닉네임을 입력하면 4자리 코드가 생성됩니다.</p><div class="field"><label>닉네임</label><input id="n" maxlength="12" placeholder="닉네임"></div><div class="field"><label>Quiz 제한 시간</label><div class="row"><button class="btn" id="t10">10초</button><button class="btn ghost" id="t15">15초</button></div></div><button class="btn" id="createBtn">🎡 Battle 만들기</button><div class="err" id="err"></div></div></div></main>`;t10.onclick=()=>{time=10;t10.classList.remove('ghost');t15.classList.add('ghost')};t15.onclick=()=>{time=15;t15.classList.remove('ghost');t10.classList.add('ghost')};createBtn.onclick=async()=>{name=n.value.trim();if(!name)return err.textContent='닉네임을 입력해주세요.';for(let k=0;k<20;k++){pin=String(Math.floor(1000+Math.random()*9000));if(!(await ref().once('value')).exists())break}uid=Math.random().toString(36).slice(2)+Date.now();role='host';try{await ref().set({meta:{hostId:uid,timeLimit:time,questions:questions},state:{phase:'lobby',round:-1,result:null,event:null},players:{[uid]:{name,role:'host',score:0}}});go('lobby')}catch(e){err.textContent='Firebase 연결 실패: '+e.message}}}
function join(){app.innerHTML=nav()+`<main><div class="stage"><div class="card"><h1 class="title">Battle 참가</h1><p class="sub">친구의 4자리 코드를 입력하세요.</p><div class="field"><label>Battle 코드</label><input id="p" inputmode="numeric" maxlength="4" placeholder="1234"></div><div class="field"><label>닉네임</label><input id="n" maxlength="12" placeholder="닉네임"></div><button class="btn" id="enter">참가하기</button><div class="err" id="err"></div></div></div></main>`;document.getElementById('enter').onclick=async()=>{const code=document.getElementById('p').value.trim(),nm=document.getElementById('n').value.trim();if(!/^\d{4}$/.test(code)||!nm)return document.getElementById('err').textContent='코드와 닉네임을 입력해주세요.';pin=code;name=nm;try{const s=await ref().once('value');if(!s.exists())throw Error('존재하지 않는 Battle입니다.');const d=s.val(),ps=Object.values(d.players||{});if(ps.some(x=>x.role==='player'))throw Error('이미 참가자가 있습니다.');uid=Math.random().toString(36).slice(2)+Date.now();role='player';questions=d.meta.questions||Q;time=d.meta.timeLimit||10;await players().child(uid).set({name,role:'player',score:0});go('lobby')}catch(e){document.getElementById('err').textContent=e.message}}}
function lobby(){app.innerHTML=nav()+`<main><div class="stage"><div class="card"><div class="pin"><small>Battle 참가 코드</small><strong>${pin}</strong></div><h1 class="title">Battle 준비</h1><p class="sub">상대가 참가하면 호스트의 시작 버튼이 바로 활성화됩니다.</p><div class="players" id="list"></div><button class="btn" id="start" disabled>상대를 기다리는 중…</button><button class="btn ghost" id="leave" style="margin-top:10px">나가기</button><div class="err" id="err"></div></div></div></main>`;const pc=s=>{const a=Object.entries(s.val()||{}).map(([id,p])=>({id,...p})),h=a.find(x=>x.role==='host'),o=a.find(x=>x.role==='player');score=(role==='host'?h:o)?.score||0;oppScore=(role==='host'?o:h)?.score||0;list.innerHTML=`<div class="player me"><div class="emoji">🔥</div><div class="pname">${esc(h?.name||'호스트')}</div><div class="score">${h?.score||0}</div></div><div class="player"><div class="emoji">💧</div><div class="pname">${esc(o?.name||'상대 대기 중')}</div><div class="score">${o?.score||'—'}</div></div>`;if(role==='host'){start.disabled=!o;start.textContent=o?'🎡 게임 시작':'상대를 기다리는 중…'}};players().on('value',pc);offs.push(()=>players().off('value',pc));const sc=s=>{const v=s.val();if(!v)return;if(v.phase==='wheel'){round=v.round;go('wheel')}else if(v.phase==='quiz'){round=v.round;go('quiz')}else if(v.phase==='event'){round=v.round;go('event')}else if(v.phase==='final')go('final')};state().on('value',sc);offs.push(()=>state().off('value',sc));start.onclick=async()=>{if(role==='host')await state().set({phase:'wheel',round:0,result:null,event:null})};leave.onclick=()=>go('home')}
function wheelSvg(){let s='<svg viewBox="0 0 360 360">',c=['#ff6b6b','#22b8cf','#ffb020','#7c5cfc','#ff6b6b','#22b8cf','#ffb020','#7c5cfc'];for(let i=0;i<8;i++){let a=(-90+i*45)*Math.PI/180,b=(-45+i*45)*Math.PI/180,x1=180+170*Math.cos(a),y1=180+170*Math.sin(a),x2=180+170*Math.cos(b),y2=180+170*Math.sin(b),m=(-67.5+i*45)*Math.PI/180,tx=180+108*Math.cos(m),ty=180+108*Math.sin(m);s+=`<path d="M180 180 L${x1} ${y1} A170 170 0 0 1 ${x2} ${y2}Z" fill="${c[i]}" stroke="#fff" stroke-width="3"/><text x="${tx}" y="${ty}" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" dominant-baseline="middle">${E[i]}</text>`}return s+'</svg>'}
function wheel(){app.innerHTML=nav()+`<main><div class="stage"><div class="card"><div class="round"><span>ROUND ${round+1} / ${questions.length}</span><span>🔥 ${score} : ${oppScore} 💧</span></div><div class="wheel" id="wheel"><div class="pointer">▼</div>${wheelSvg()}<div class="hub">🎡</div></div><button class="btn" id="spin">🎡 룰렛 돌리기</button><div class="status" id="status">누구나 룰렛을 돌릴 수 있어요. 먼저 누른 한 명이 결과를 결정합니다.</div></div></div></main>`;const sc=s=>{const v=s.val();if(!v)return;if(v.phase==='wheel'&&v.round===round&&v.result!=null&&v.resultKey!==spinKey){spinKey=v.resultKey;const w=document.getElementById('wheel');if(w)w.style.transform=`rotate(${1440+v.result*45+22.5}deg)`;setTimeout(()=>{const ev=E[v.result];state().update(ev==='QUIZ'?{phase:'quiz'}:{phase:'event',event:ev})},1800)}else if(v.phase==='quiz'&&v.round===round)go('quiz');else if(v.phase==='event'&&v.round===round)go('event');else if(v.phase==='final')go('final')};state().on('value',sc);offs.push(()=>state().off('value',sc));spin.onclick=async()=>{const s=await state().once('value'),v=s.val()||{};if(v.phase!=='wheel'||v.result!=null)return;await state().update({result:Math.floor(Math.random()*8),resultKey:uid+'_'+Date.now(),spunBy:uid})}}
function quiz(){const q=questions[round%questions.length];app.innerHTML=nav()+`<main><div class="stage"><div class="card"><div class="round"><span>ROUND ${round+1} / ${questions.length}</span><span>🔥 ${score} : ${oppScore} 💧</span></div><div class="question">${esc(q.text)}</div><div class="answers">${q.choices.map((x,i)=>`<button class="answer ${['a','b','c','d'][i]}" data-i="${i}">${esc(x)}</button>`).join('')}</div><div class="status" id="status">정답을 선택하세요.</div></div></div></main>`;let done=false,left=time;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i));const tm=setInterval(()=>{left--;if(!done)status.textContent=`남은 시간 ${left}초`;if(left<=0){clearInterval(tm);if(!done)answer(-1)}},1000);offs.push(()=>clearInterval(tm));const ar=s=>{const v=s.val()||{};if(Object.keys(v).length>=2&&!done)state().update({phase:'event',event:'QUIZ_DONE'});};const ans=ref().child('answers').child(round);ans.on('value',ar);offs.push(()=>ans.off('value',ar));bindStateNav();async function answer(i){if(done)return;done=true;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);const q=questions[round%questions.length],ok=i===q.correct;const ps=players().child(uid),ss=await ps.child('score').once('value'),cur=Number(ss.val()||0);await ps.update({score:cur+(ok?10:0)});await ans.child(uid).set({answer:i,correct:ok,points:ok?10:0});status.textContent=ok?'정답! +10점 🎉':'오답!'}}
async function event(){bindStateNav();const st=(await state().once('value')).val()||{},ev=st.event;const key=round+'_'+String(ev);if(appliedKey!==key){appliedKey=key;const s=await players().child(uid).child('score').once('value'),cur=Number(s.val()||0);if(ev==='+10'||ev==='+20'||ev==='BONUS'){await players().child(uid).child('score').set(cur+(ev==='+10'?10:ev==='+20'?20:30))}else if(ev==='STEAL'){const snap=await players().once('value'),a=Object.entries(snap.val()||{}),o=a.find(([x])=>x!==uid);if(o){const steal=Math.min(10,Number(o[1].score||0));await players().child(o[0]).child('score').set(Number(o[1].score||0)-steal);await players().child(uid).child('score').set(cur+steal)}}}const fresh=await players().once('value'),a=Object.entries(fresh.val()||{}),me=a.find(([x])=>x===uid)?.[1]||{},o=a.find(([x])=>x!==uid)?.[1]||{};score=me.score||0;oppScore=o.score||0;let text=ev==='QUIZ_DONE'?'🧠 Quiz 완료!':ev==='+10'?'🎁 +10점!':ev==='+20'?'🚀 +20점!':ev==='BONUS'?'💎 보너스 +30점!':ev==='STEAL'?'💥 스틸! 상대 점수 10점을 가져왔어요!':'✨ 완료!';app.innerHTML=nav()+`<main><div class="stage"><div class="card result"><div class="big">${ev==='STEAL'?'💥':ev==='BONUS'?'💎':'🎉'}</div><h2>${text}</h2><p>${esc(name)} ${score}점 · 상대 ${oppScore}점</p>${role==='host'?`<button class="btn" id="next">${round+1>=questions.length?'🏆 최종 결과':'➡️ 다음 룰렛'}</button>`:`<div class="status">호스트가 다음 라운드를 시작할 때까지 기다려주세요.</div>`}</div></div></main>`;if(role==='host')next.onclick=()=>round+1>=questions.length?state().set({phase:'final',round}):state().set({phase:'wheel',round:round+1,result:null,event:null})}
function finalScreen(){players().once('value').then(s=>{const a=Object.values(s.val()||{}),h=a.find(x=>x.role==='host')||{},p=a.find(x=>x.role==='player')||{};score=(role==='host'?h:p).score||0;oppScore=(role==='host'?p:h).score||0;const win=score>oppScore?'🏆 승리!':score===oppScore?'🤝 무승부!':'💥 패배!';app.innerHTML=nav()+`<main><div class="stage"><div class="card result"><div class="big">🏆</div><h1>${win}</h1><h2>${score} : ${oppScore}</h2><div class="leader"><span>🔥 ${esc(h.name||'Host')}</span><b>${h.score||0}점</b></div><div class="leader"><span>💧 ${esc(p.name||'Player')}</span><b>${p.score||0}점</b></div><button class="btn" id="newBtn">새 Battle 만들기</button></div></div></main>`;newBtn.onclick=()=>{pin='';go('create')}})}render()})();
</script></body></html>
