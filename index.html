<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FormWheel — Wheel Battle</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#18181b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.nav{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{border:0;background:none;font-weight:800;font-size:18px;cursor:pointer}.tag{font-size:11px;color:#4f46e5;background:#eef0ff;padding:4px 8px;border-radius:99px;margin-left:6px}.code{font-size:13px;color:#71717a}.code b{color:#18181b;letter-spacing:2px}main{min-height:calc(100vh - 62px);display:flex;justify-content:center;padding:30px 16px}.stage{width:100%;max-width:720px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 5px 25px #00000008}.title{text-align:center;font-size:28px;margin:4px 0 8px;font-weight:850}.sub{text-align:center;color:#71717a;line-height:1.55;margin:0 0 24px}.row,.players,.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#52525b}input{width:100%;padding:13px;border:1.5px solid #dddde5;border-radius:11px;outline:0}input:focus{border-color:#4f46e5}.btn{width:100%;padding:14px;border:0;border-radius:11px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.ghost{background:#fff;color:#18181b;border:1.5px solid #dddde5}.pin{text-align:center;background:#eef0ff;border:1.5px dashed #4f46e5;border-radius:15px;padding:20px;margin-bottom:18px}.pin small{display:block;color:#4f46e5;font-weight:700}.pin strong{font-size:45px;letter-spacing:7px}.player{border:1.5px solid #e5e7eb;border-radius:14px;padding:17px;text-align:center}.me{border-color:#4f46e5;background:#f7f7ff}.emoji{font-size:28px}.pname{font-weight:800}.score{font-size:30px;font-weight:850;margin-top:5px}.status{text-align:center;background:#f1f1f8;color:#71717a;border-radius:11px;padding:12px;margin:14px 0;font-size:14px}.round{display:flex;justify-content:center;color:#71717a;font-size:13px;font-weight:700;margin-bottom:10px}.wheel{position:relative;width:min(360px,82vw);height:min(360px,82vw);margin:15px auto 20px;transition:transform 1.8s cubic-bezier(.15,.8,.2,1)}.wheel svg{width:100%;height:100%;filter:drop-shadow(0 8px 18px #0002)}.pointer{position:absolute;left:50%;top:-7px;transform:translateX(-50%);font-size:30px;z-index:2}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#fff;border:7px solid #4f46e5;display:flex;align-items:center;justify-content:center;z-index:2}.question{font-size:22px;font-weight:850;line-height:1.4;margin:10px 0 18px}.answer{border:0;border-radius:12px;padding:18px 10px;color:#fff;font-weight:800;cursor:pointer}.a{background:#ff6b6b}.b{background:#22b8cf}.c{background:#ffb020}.d{background:#7c5cfc}.answer:disabled{opacity:.4}.result{text-align:center}.big{font-size:60px}.leader{display:flex;justify-content:space-between;background:#f1f1f8;border-radius:10px;padding:12px;margin:8px 0}.err{color:#e11d48;text-align:center;font-size:13px;min-height:18px;margin-top:8px}
.dualwheel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 4px}.wheelCol{text-align:center;border:1.5px solid #f0f0f5;border-radius:14px;padding:12px 8px}.side-title{font-weight:800;font-size:14px}.wheelCol .score{font-size:20px;font-weight:850;color:#4f46e5;margin:2px 0 4px}.wheel.small{width:min(150px,38vw);height:min(150px,38vw);margin:6px auto 10px}.badge{display:inline-block;margin-top:4px;padding:9px 12px;border-radius:10px;background:#eef0ff;color:#4f46e5;font-weight:800;font-size:14px}
@media(max-width:520px){.card{padding:18px}.row,.players,.answers{gap:9px}.title{font-size:23px}.question{font-size:19px}.pin strong{font-size:38px}}
</style></head><body><div id="app"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script>
(()=>{const HOME='https://semicolonxss.github.io/Formwheel/';const C={apiKey:'AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE',authDomain:'formwheel.firebaseapp.com',databaseURL:'https://formwheel-default-rtdb.firebaseio.com/',projectId:'formwheel',storageBucket:'formwheel.firebasestorage.app',messagingSenderId:'431583088241',appId:'1:431583088241:web:74e0e34ea1e3e1170c55d0'};firebase.initializeApp(C);const db=firebase.database();
const Q=[{text:'대한민국의 수도는?',choices:['부산','서울','인천','대구'],correct:1},{text:'물의 화학식은?',choices:['CO₂','O₂','H₂O','NaCl'],correct:2},{text:'태양계에서 가장 큰 행성은?',choices:['지구','목성','화성','토성'],correct:1},{text:'평년은 며칠일까요?',choices:['364일','365일','366일','360일'],correct:1},{text:'HTML의 뜻으로 맞는 것은?',choices:['HyperText Markup Language','HighText Machine Language','Home Tool Markup Language','Hyperlink Text Main Language'],correct:0}];
const E=['+10','+20','QUIZ','QUIZ','+10','BONUS','+20','STEAL'];let screen='home',pin='',uid='',name='',role='',round=0,questions=Q,time=10,score=0,oppScore=0;const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ref=()=>db.ref('wheelBattle/'+pin),players=()=>ref().child('players'),state=()=>ref().child('state');let offs=[];function off(){offs.forEach(f=>f());offs=[]}function nav(){return `<div class="nav"><button class="brand" id="home">FormWheel <span class="tag">Wheel Battle</span></button>${pin?`<div class="code">코드 <b>${pin}</b></div>`:''}</div>`}function go(s){off();screen=s;render()}function render(){if(screen==='home')home();else if(screen==='create')create();else if(screen==='join')join();else if(screen==='lobby')lobby();else if(screen==='round')roundScreen();else finalScreen();const h=document.getElementById('home');if(h)h.onclick=()=>{off();pin='';screen='home';render()}}
function bindStateNav(){const sc=s=>{const v=s.val();if(!v)return;
  if(v.phase==='round'&&(screen!=='round'||v.round!==round)){round=v.round;go('round')}
  else if(v.phase==='final'&&screen!=='final'){go('final')}};
  state().on('value',sc);offs.push(()=>state().off('value',sc))}
function home(){app.innerHTML=nav()+`<main><div class="stage"><div class="card"><h1 class="title">🎡 Wheel Battle</h1><p class="sub">친구와 실시간으로 룰렛을 돌리고 Quiz를 풀며 대결해보세요!</p><div class="row"><button class="btn" id="make">⚔️ Battle 만들기</button><button class="btn ghost" id="joinBtn">🚪 참가하기</button></div></div></div></main>`;make.onclick=()=>go('create');joinBtn.onclick=()=>go('join')}
function create(){app.innerHTML=nav()+`<main><div class="stage"><div class="card"><h1 class="title">Battle 만들기</h1><p class="sub">닉네임을 입력하면 4자리 코드가 생성됩니다.</p><div class="field"><label>닉네임</label><input id="n" maxlength="12" placeholder="닉네임"></div><div class="field"><label>Quiz 제한 시간</label><div class="row"><button class="btn" id="t10">10초</button><button class="btn ghost" id="t15">15초</button></div></div><button class="btn" id="createBtn">🎡 Battle 만들기</button><div class="err" id="err"></div></div></div></main>`;t10.onclick=()=>{time=10;t10.classList.remove('ghost');t15.classList.add('ghost')};t15.onclick=()=>{time=15;t15.classList.remove('ghost');t10.classList.add('ghost')};createBtn.onclick=async()=>{name=n.value.trim();if(!name)return err.textContent='닉네임을 입력해주세요.';for(let k=0;k<20;k++){pin=String(Math.floor(1000+Math.random()*9000));if(!(await ref().once('value')).exists())break}uid=Math.random().toString(36).slice(2)+Date.now();role='host';try{await ref().set({meta:{hostId:uid,timeLimit:time,questions:questions},state:{phase:'lobby',round:-1},players:{[uid]:{name,role:'host',score:0}}});go('lobby')}catch(e){err.textContent='Firebase 연결 실패: '+e.message}}}
function join(){app.innerHTML=nav()+`<main><div class="stage"><div class="card"><h1 class="title">Battle 참가</h1><p class="sub">친구의 4자리 코드를 입력하세요.</p><div class="field"><label>Battle 코드</label><input id="p" inputmode="numeric" maxlength="4" placeholder="1234"></div><div class="field"><label>닉네임</label><input id="n" maxlength="12" placeholder="닉네임"></div><button class="btn" id="enter">참가하기</button><div class="err" id="err"></div></div></div></main>`;document.getElementById('enter').onclick=async()=>{const code=document.getElementById('p').value.trim(),nm=document.getElementById('n').value.trim();if(!/^\d{4}$/.test(code)||!nm)return document.getElementById('err').textContent='코드와 닉네임을 입력해주세요.';pin=code;name=nm;try{const s=await ref().once('value');if(!s.exists())throw Error('존재하지 않는 Battle입니다.');const d=s.val(),ps=Object.values(d.players||{});if(ps.some(x=>x.role==='player'))throw Error('이미 참가자가 있습니다.');uid=Math.random().toString(36).slice(2)+Date.now();role='player';questions=d.meta.questions||Q;time=d.meta.timeLimit||10;await players().child(uid).set({name,role:'player',score:0});go('lobby')}catch(e){document.getElementById('err').textContent=e.message}}}
function lobby(){app.innerHTML=nav()+`<main><div class="stage"><div class="card"><div class="pin"><small>Battle 참가 코드</small><strong>${pin}</strong></div><h1 class="title">Battle 준비</h1><p class="sub">상대가 참가하면 호스트의 시작 버튼이 바로 활성화됩니다.</p><div class="players" id="list"></div><button class="btn" id="start" disabled>상대를 기다리는 중…</button><button class="btn ghost" id="leave" style="margin-top:10px">나가기</button><div class="err" id="err"></div></div></div></main>`;const pc=s=>{const a=Object.entries(s.val()||{}).map(([id,p])=>({id,...p})),h=a.find(x=>x.role==='host'),o=a.find(x=>x.role==='player');score=(role==='host'?h:o)?.score||0;oppScore=(role==='host'?o:h)?.score||0;list.innerHTML=`<div class="player me"><div class="emoji">🔥</div><div class="pname">${esc(h?.name||'호스트')}</div><div class="score">${h?.score||0}</div></div><div class="player"><div class="emoji">💧</div><div class="pname">${esc(o?.name||'상대 대기 중')}</div><div class="score">${o?.score||'—'}</div></div>`;if(role==='host'){start.disabled=!o;start.textContent=o?'🎡 게임 시작':'상대를 기다리는 중…'}};players().on('value',pc);offs.push(()=>players().off('value',pc));bindStateNav();start.onclick=async()=>{if(role==='host')await state().set({phase:'round',round:0,host:{result:null,event:null,done:false},guest:{result:null,event:null,done:false}})};leave.onclick=()=>go('home')}
function wheelSvg(){let s='<svg viewBox="0 0 360 360">',c=['#ff6b6b','#22b8cf','#ffb020','#7c5cfc','#ff6b6b','#22b8cf','#ffb020','#7c5cfc'];for(let i=0;i<8;i++){let a=(-90+i*45)*Math.PI/180,b=(-45+i*45)*Math.PI/180,x1=180+170*Math.cos(a),y1=180+170*Math.sin(a),x2=180+170*Math.cos(b),y2=180+170*Math.sin(b),m=(-67.5+i*45)*Math.PI/180,tx=180+108*Math.cos(m),ty=180+108*Math.sin(m);s+=`<path d="M180 180 L${x1} ${y1} A170 170 0 0 1 ${x2} ${y2}Z" fill="${c[i]}" stroke="#fff" stroke-width="3"/><text x="${tx}" y="${ty}" fill="#fff" font-size="13" font-weight="800" text-anchor="middle" dominant-baseline="middle">${E[i]}</text>`}return s+'</svg>'}
function roundScreen(){bindStateNav();const q=questions[round%questions.length];const mySide=role==='host'?'host':'guest';
app.innerHTML=nav()+`<main><div class="stage"><div class="card"><div class="round"><span>ROUND ${round+1} / ${questions.length}</span></div><div class="dualwheel"><div class="wheelCol"><div class="side-title">🔥 <span id="nameHost">Host</span></div><div class="score" id="scoreHost">0점</div><div class="wheel small" id="wheelHost"><div class="pointer">▼</div>${wheelSvg()}<div class="hub">🎡</div></div><div id="areaHost"></div></div><div class="wheelCol"><div class="side-title">💧 <span id="nameGuest">Guest</span></div><div class="score" id="scoreGuest">0점</div><div class="wheel small" id="wheelGuest"><div class="pointer">▼</div>${wheelSvg()}<div class="hub">🎡</div></div><div id="areaGuest"></div></div></div><div class="status" id="roundStatus">각자 자신의 룰렛을 돌려주세요.</div><div id="footer"></div></div></div></main>`;
const local={host:{animated:false,revealed:false,applying:false,timerStarted:false,answered:false,left:time,timerId:null},guest:{animated:false,revealed:false,applying:false,timerStarted:false,answered:false,left:time,timerId:null}};
const pc=s=>{const a=Object.entries(s.val()||{}).map(([id,p])=>({id,...p})),h=a.find(x=>x.role==='host'),o=a.find(x=>x.role==='player');const nh=document.getElementById('nameHost'),ng=document.getElementById('nameGuest'),sh=document.getElementById('scoreHost'),sg=document.getElementById('scoreGuest');if(nh)nh.textContent=h?.name||'Host';if(ng)ng.textContent=o?.name||'Guest';if(sh)sh.textContent=(h?.score||0)+'점';if(sg)sg.textContent=(o?.score||0)+'점';score=(role==='host'?h:o)?.score||0;oppScore=(role==='host'?o:h)?.score||0};
players().on('value',pc);offs.push(()=>players().off('value',pc));
async function applyEventScore(side,ev){const ps=players().child(uid),ss=await ps.child('score').once('value'),cur=Number(ss.val()||0);if(ev==='+10'||ev==='+20'||ev==='BONUS'){await ps.update({score:cur+(ev==='+10'?10:ev==='+20'?20:30)})}else if(ev==='STEAL'){const snap=await players().once('value'),arr=Object.entries(snap.val()||{}),oppEnt=arr.find(([x])=>x!==uid);if(oppEnt){const steal=Math.min(10,Number(oppEnt[1].score||0));await players().child(oppEnt[0]).child('score').set(Number(oppEnt[1].score||0)-steal);await ps.update({score:cur+steal})}}await state().child(side).update({event:ev,done:true})}
function handleSide(side,data,isMine){const areaId=side==='host'?'areaHost':'areaGuest',wheelId=side==='host'?'wheelHost':'wheelGuest';const el=document.getElementById(areaId);const st=local[side];
if(!data||data.result==null){st.animated=false;st.revealed=false;st.applying=false;st.timerStarted=false;st.answered=false;if(st.timerId)clearInterval(st.timerId);const w=document.getElementById(wheelId);if(w)w.style.transform='';
if(isMine){el.innerHTML=`<button class="btn" id="spin${side}">🎡 스핀</button>`;const b=document.getElementById('spin'+side);if(b)b.onclick=async()=>{const cur=(await state().child(side).once('value')).val();if(cur&&cur.result!=null)return;await state().child(side).update({result:Math.floor(Math.random()*8)})}}else{el.innerHTML='<div class="status">상대 차례를 기다리는 중…</div>'}return}
if(!st.animated){st.animated=true;const w=document.getElementById(wheelId);if(w)w.style.transform=`rotate(${1440+data.result*45+22.5}deg)`;el.innerHTML='<div class="status">룰렛이 돌아가는 중…</div>';setTimeout(()=>{st.revealed=true;state().child(side).once('value').then(s=>handleSide(side,s.val(),isMine))},1800);return}
if(!st.revealed){el.innerHTML='<div class="status">룰렛이 돌아가는 중…</div>';return}
const ev=E[data.result];
if(ev==='QUIZ'&&!data.done){if(isMine){if(!st.timerStarted){st.timerStarted=true;el.innerHTML=`<div class="question" style="font-size:15px;margin:4px 0">${esc(q.text)}</div><div class="answers" style="grid-template-columns:1fr;gap:6px">${q.choices.map((x,i)=>`<button class="answer a" data-i="${i}">${esc(x)}</button>`).join('')}</div><div class="status" id="timer${side}">남은 시간 ${st.left}초</div>`;const answer=async(i)=>{if(st.answered)return;st.answered=true;clearInterval(st.timerId);el.querySelectorAll('button[data-i]').forEach(x=>x.disabled=true);const ok=i===q.correct;const ps=players().child(uid),ss=await ps.child('score').once('value'),cur=Number(ss.val()||0);await ps.update({score:cur+(ok?10:0)});await state().child(side).update({event:'QUIZ',quizCorrect:ok,done:true})};el.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i));st.timerId=setInterval(()=>{st.left--;const t=document.getElementById('timer'+side);if(t)t.textContent=`남은 시간 ${st.left}초`;if(st.left<=0){clearInterval(st.timerId);answer(-1)}},1000);offs.push(()=>clearInterval(st.timerId))}}else{el.innerHTML='<div class="status">상대가 퀴즈를 푸는 중…</div>'}return}
if(ev!=='QUIZ'&&!data.done){if(isMine&&!st.applying){st.applying=true;applyEventScore(side,ev)}el.innerHTML='<div class="status">결과 처리 중…</div>';return}
const badgeText=ev==='QUIZ'?(data.quizCorrect?'🎯 정답! +10':'❌ 오답'):ev==='STEAL'?'💥 스틸!':ev==='BONUS'?'💎 보너스 +30':`🎁 ${ev}`;el.innerHTML=`<div class="badge">${badgeText}</div>`}
const sc=s=>{const v=s.val();if(!v||v.phase!=='round'||v.round!==round)return;handleSide('host',v.host,mySide==='host');handleSide('guest',v.guest,mySide==='guest');const bothDone=v.host&&v.host.done&&v.guest&&v.guest.done;const rs=document.getElementById('roundStatus'),footer=document.getElementById('footer');if(bothDone){if(rs)rs.textContent='라운드 종료!';if(role==='host'){footer.innerHTML=`<button class="btn" id="next">${round+1>=questions.length?'🏆 최종 결과':'➡️ 다음 라운드'}</button>`;const nb=document.getElementById('next');if(nb)nb.onclick=()=>round+1>=questions.length?state().set({phase:'final',round}):state().set({phase:'round',round:round+1,host:{result:null,event:null,done:false},guest:{result:null,event:null,done:false}})}else{footer.innerHTML='<div class="status">호스트가 다음 라운드를 시작할 때까지 기다려주세요.</div>'}}else{if(rs)rs.textContent='각자 자신의 룰렛을 돌려주세요.';if(footer)footer.innerHTML=''}};
state().on('value',sc);offs.push(()=>state().off('value',sc))}
function finalScreen(){players().once('value').then(s=>{const a=Object.values(s.val()||{}),h=a.find(x=>x.role==='host')||{},p=a.find(x=>x.role==='player')||{};score=(role==='host'?h:p).score||0;oppScore=(role==='host'?p:h).score||0;const win=score>oppScore?'🏆 승리!':score===oppScore?'🤝 무승부!':'💥 패배!';app.innerHTML=nav()+`<main><div class="stage"><div class="card result"><div class="big">🏆</div><h1>${win}</h1><h2>${score} : ${oppScore}</h2><div class="leader"><span>🔥 ${esc(h.name||'Host')}</span><b>${h.score||0}점</b></div><div class="leader"><span>💧 ${esc(p.name||'Player')}</span><b>${p.score||0}점</b></div><button class="btn" id="newBtn">새 Battle 만들기</button></div></div></main>`;newBtn.onclick=()=>{pin='';go('create')}})}render()})();
</script></body></html>
